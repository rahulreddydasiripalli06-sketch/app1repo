<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple E-Commerce App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f4f4f4; padding: 20px; }
    header { background: #333; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; }
    .container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .products { flex: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .product-card { background: #fff; padding: 15px; border-radius: 5px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product-card h3 { margin: 10px 0; font-size: 1.1rem; }
    .product-card p { color: #668; margin-bottom: 10px; font-weight: bold; }
    button { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 3px; cursor: pointer; }
    button:hover { background: #218838; }
    .cart { flex: 1; background: #fff; padding: 15px; border-radius: 5px; height: fit-content; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    .total { font-weight: bold; margin-top: 15px; font-size: 1.2rem; }
  </style>
</head>
<body>

  <header>
    <h2>MiniStore</h2>
    <div id="cart-count">Cart: 0 items</div>
  </header>

  <div class="container">
    <div class="products" id="product-list"></div>
    <div class="cart">
      <h3>Your Shopping Cart</h3>
      <div id="cart-items"></div>
      <div class="total">Total: \$<span id="cart-total">0</span></div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "T-Shirt", price: 20 },
      { id: 2, name: "Cap", price: 15 },
      { id: 3, name: "Backpack", price: 45 },
      { id: 4, name: "Sneakers", price: 60 }
    ];

    let cart = [];

    const productListEl = document.getElementById("product-list");
    const cartItemsEl = document.getElementById("cart-items");
    const cartCountEl = document.getElementById("cart-count");
    const cartTotalEl = document.getElementById("cart-total");

    function renderProducts() {
      productListEl.innerHTML = products.map(p => `
        <div class="product-card">
          <h3>${p.name}</h3>
          <p>$${p.price}</p>
          <button onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      renderCart();
    }

    function renderCart() {
      cartItemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span>${item.name}</span>
          <span>$${item.price}</span>
        </div>
      `).join('');
      
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      cartTotalEl.textContent = total;
      cartCountEl.textContent = `Cart: ${cart.length} items`;
    }

    renderProducts();
  </script>

</body>
</html>
